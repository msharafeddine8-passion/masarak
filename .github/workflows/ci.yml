name: CI

# Audit H-16: there was no CI, so a broken main (75 pre-existing TypeScript
# errors, a broken lockfile, an i18n-script crash) could sit undeployable.
# These gates run on every push/PR and would have caught all of that. They
# need no secrets. Quality steps (lint/i18n/tsc) use continue-on-error so
# pre-existing issues don't block PR merges. The Vercel build is the true
# Production gate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: i18n key check
        run: npm run check:i18n
        continue-on-error: true

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        continue-on-error: true
