name: CI

# Audit H-16: there was no CI, so a broken main (75 pre-existing TypeScript
# errors, a broken lockfile, an i18n-script crash) could sit undeployable.
# These gates run on every push/PR and would have caught all of that. They need
# no secrets. (Add a `build` job with your Supabase env as repo secrets if you
# want full next-build coverage in CI too.)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: i18n key check
        run: npm run check:i18n

      - name: TypeScript typecheck
        run: npx tsc --noEmit
